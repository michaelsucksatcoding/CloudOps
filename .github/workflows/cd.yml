name: CD — CloudOps AI Deployment & Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Amazon EKS (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'cloudops-eks-dev' }}
      TARGET_NAMESPACE: ${{ inputs.environment == 'prod' && 'cloudops-prod' || 'cloudops-dev' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Smoke Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: DIAGNOSTIC [temp] - Print OIDC claims (sub/aud)
        id: diag-oidc-claims
        uses: actions/github-script@v7
        with:
          script: |
            const jwt = await core.getIDToken();
            const payload = jwt.split('.')[1];
            const claims = JSON.parse(
              Buffer.from(payload, 'base64url').toString('utf-8')
            );
            console.log("DIAGNOSTIC aud = " + JSON.stringify(claims.aud));
            console.log("DIAGNOSTIC sub = " + JSON.stringify(claims.sub));
            core.setOutput('oidc_sub', JSON.stringify(claims.sub));

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cloudops-cd-${{ github.sha }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cloudops-api:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cloudops-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push ML Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ml
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cloudops-ml:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cloudops-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Event Processor Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: event-processor
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cloudops-event-processor:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/cloudops-event-processor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Deployed Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/cloudops-api:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Update Kubeconfig for Target EKS Cluster
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # The cloudops-dev and cloudops-monitoring namespaces are pre-provisioned
      # infrastructure (infrastructure/kubernetes/namespaces/namespace-dev.yaml),
      # applied at cluster bootstrap by an admin identity. They are NOT created
      # here: --create-namespace is deliberately omitted so the deploy role stays
      # namespace-scoped (namespace objects are cluster-scoped and not covered by
      # AmazonEKSEditPolicy). Helm fails fast if the target namespace is missing.
      - name: Deploy Application via Helm
        run: |
          helm upgrade --install cloudops-ai infrastructure/kubernetes/helm/cloudops-ai \
            --namespace ${{ env.TARGET_NAMESPACE }} \
            --set api.image.repository=${{ steps.login-ecr.outputs.registry }}/cloudops-api \
            --set api.image.tag=${{ github.sha }} \
            --set ml.image.repository=${{ steps.login-ecr.outputs.registry }}/cloudops-ml \
            --set ml.image.tag=${{ github.sha }} \
            --set eventProcessor.image.repository=${{ steps.login-ecr.outputs.registry }}/cloudops-event-processor \
            --set eventProcessor.image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Verify Kubernetes Rollout Status
        run: |
          kubectl rollout status deployment/cloudops-ai-api -n ${{ env.TARGET_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/cloudops-ai-ml -n ${{ env.TARGET_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/cloudops-ai-event-processor -n ${{ env.TARGET_NAMESPACE }} --timeout=180s

      - name: Inspect Workload and Service Status
        run: |
          kubectl get pods -n ${{ env.TARGET_NAMESPACE }}
          kubectl get services -n ${{ env.TARGET_NAMESPACE }}
          kubectl get ingress -n ${{ env.TARGET_NAMESPACE }} || true

      - name: Execute Post-Deployment Smoke Test
        run: |
          echo "Establishing port-forward for smoke test verification..."
          kubectl port-forward svc/cloudops-ai-api 8000:8000 -n ${{ env.TARGET_NAMESPACE }} &
          PF_PID=$!
          sleep 5
          python scripts/smoke_test.py --base-url http://localhost:8000 --retries 10 --interval 3
          kill $PF_PID || true
