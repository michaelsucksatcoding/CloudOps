name: CI — CloudOps AI Quality & Security Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality-and-tests:
    name: Python Quality Gates & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade Pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Type Analysis
        run: mypy services

      - name: Run Pytest Test Suite with Coverage
        run: pytest --cov=services --cov-report=term-missing

      - name: Run Dependency Security Audit
        run: pip-audit --desc

  helm-manifest-validation:
    name: Helm Chart & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint Helm Chart
        run: helm lint infrastructure/kubernetes/helm/cloudops-ai

      - name: Render Helm Templates Dry-Run (default values)
        run: helm template cloudops-ai infrastructure/kubernetes/helm/cloudops-ai

      - name: Assert rendered manifests stay cloud-neutral
        run: |
          render=$(helm template cloudops-ai infrastructure/kubernetes/helm/cloudops-ai)
          if echo "$render" | grep -Eqi 'amazonaws\.com|eks\.amazonaws|ingressClassName: alb|storageClassName: gp2'; then
            echo "::error::Rendered Helm output contains cloud-provider-specific dependencies"
            echo "$render" | grep -Ein 'amazonaws\.com|eks\.amazonaws|ingressClassName: alb|storageClassName: gp2'
            exit 1
          fi
          echo "Rendered Helm output is cloud-neutral."

  local-runtime-validation:
    name: Local Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Validates the primary local runtime. No cloud credentials are used or
      # required anywhere in this job.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the Project and Its Declared Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Assert the project depends on no cloud SDK
        run: |
          # boto3/botocore were removed with the cloud architecture. This guard
          # inspects the PROJECT's declared and resolved dependencies.
          #
          # It deliberately does NOT assert that the runner's global Python
          # environment is free of boto3/botocore. GitHub-hosted runners ship
          # those packages preinstalled for their own AWS tooling, which has
          # nothing to do with this repository, so an environment-wide
          # `pip list` check is an unreliable false positive.
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from importlib import metadata
          from pathlib import Path

          FORBIDDEN = {"boto3", "botocore"}
          REQUIREMENT_FILE_PATTERNS = (
              "requirements*.txt",
              "requirements*.in",
              "constraints*.txt",
              "poetry.lock",
              "Pipfile.lock",
              "uv.lock",
              "pdm.lock",
          )
          failures: list[str] = []

          def normalize(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name).strip().lower()

          def requirement_name(spec: str) -> str | None:
              match = re.match(r"\s*([A-Za-z0-9][A-Za-z0-9._-]*)", spec)
              return normalize(match.group(1)) if match else None

          def applies_to_install(spec: str, extras: set[str]) -> bool:
              """Skip requirements gated behind extras that were not installed."""
              if ";" not in spec:
                  return True
              gated = re.findall(
                  r"""extra\s*==\s*["']([^"']+)["']""", spec.split(";", 1)[1]
              )
              if not gated:
                  return True
              return any(extra in extras or extra == "all" for extra in gated)

          # --- 1. Declared dependencies (static, comment-safe) ---------------
          project_name = os.environ.get("PROJECT_DIST_NAME", "cloudops-ai")
          requested_extras: set[str] = set()
          pyproject = Path("pyproject.toml")
          if pyproject.is_file():
              data = tomllib.loads(pyproject.read_text(encoding="utf-8-sig"))
              project = data.get("project", {})
              project_name = normalize(project.get("name", project_name))
              optional = project.get("optional-dependencies", {}) or {}
              requested_extras = {normalize(extra) for extra in optional}
              declared: list[str] = list(project.get("dependencies", []) or [])
              for extra_deps in optional.values():
                  declared += list(extra_deps)
              for spec in declared:
                  name = requirement_name(str(spec))
                  if name in FORBIDDEN:
                      failures.append(f"pyproject.toml declares {name}: {spec}")
          else:
              project_name = normalize(project_name)

          line_requirement = re.compile(
              r"^\s*(?:(?:-e|--editable)\s+)?([A-Za-z0-9][A-Za-z0-9._-]*)"
          )
          skip_prefixes = ("#", "-r", "-c", "--requirement", "--constraint")
          for pattern in REQUIREMENT_FILE_PATTERNS:
              for path in sorted(Path(".").rglob(pattern)):
                  if {".venv", ".git"} & set(path.parts):
                      continue
                  lines = path.read_text(
                      encoding="utf-8-sig", errors="replace"
                  ).splitlines()
                  for lineno, line in enumerate(lines, 1):
                      stripped = line.strip()
                      if stripped.startswith(skip_prefixes):
                          continue
                      match = line_requirement.match(stripped)
                      if match and normalize(match.group(1)) in FORBIDDEN:
                          failures.append(f"{path}:{lineno} requires {stripped}")

          # --- 2 and 3. Installed metadata and its dependency closure ------
          try:
              distribution = metadata.distribution(project_name)
          except metadata.PackageNotFoundError:
              failures.append(
                  f"project distribution {project_name!r} is not installed, so "
                  "its resolved dependencies cannot be verified"
              )
          else:
              pending: dict[str, str] = {
                  name: project_name
                  for name in (
                      requirement_name(spec)
                      for spec in (distribution.requires or [])
                      if applies_to_install(spec, requested_extras)
                  )
                  if name
              }
              visited: set[str] = set()
              while pending:
                  name, parent = pending.popitem()
                  if name in visited:
                      continue
                  visited.add(name)
                  try:
                      child = metadata.distribution(name)
                  except metadata.PackageNotFoundError:
                      # Not installed, so this edge is inactive on this
                      # interpreter/platform and cannot be a project dependency.
                      continue
                  if name in FORBIDDEN:
                      failures.append(
                          f"{name} is installed as a resolved dependency of "
                          f"{project_name!r} (reached via {parent})"
                      )
                      continue
                  for spec in child.requires or []:
                      # Third-party extras were never requested, so an
                      # extra-gated requirement is not part of this project.
                      if not applies_to_install(spec, set()):
                          continue
                      child_name = requirement_name(spec)
                      if child_name and child_name not in visited:
                          pending[child_name] = name

              # Informational only: ambient packages are not a project concern.
              installed = {
                  normalize(dist.metadata["Name"])
                  for dist in metadata.distributions()
                  if dist.metadata["Name"]
              }
              ambient = sorted(FORBIDDEN & installed)
              if ambient:
                  print(
                      "::notice::boto3/botocore are present in the runner "
                      f"environment ({', '.join(ambient)}). They are not a "
                      "project dependency, so this is not a failure."
                  )

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              print(
                  "::error::cloud SDK dependency violation(s): "
                  f"{len(failures)} found"
              )
              sys.exit(1)

          print(
              f"Project {project_name!r} declares and resolves no cloud SDK "
              "dependency."
          )
          PY

      - name: Start PostgreSQL and Wait for Healthy
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' cloudops-postgres 2>/dev/null)" = "healthy" ]; then
              echo "PostgreSQL is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL did not become healthy"
          docker compose logs postgres
          exit 1

      - name: Run Migrations and Start API, Then Verify Health
        run: |
          docker compose up -d api
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "API health endpoint responded."
              curl -fsS http://localhost:8000/health
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy"
          docker compose logs api
          docker compose down -v
          exit 1

      - name: Run ML Evaluation Job
        run: |
          docker compose run --rm ml
          docker compose down -v

  docker-build-and-scan:
    name: Container Build & Image Security Scan
    runs-on: ubuntu-latest
    needs: [python-quality-and-tests, helm-manifest-validation]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          load: true
          tags: cloudops-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ml
          load: true
          tags: cloudops-ml:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Event Processor Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: event-processor
          load: true
          tags: cloudops-event-processor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API Container Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudops-api:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
