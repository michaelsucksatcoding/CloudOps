services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: cloudops-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - DATABASE_URL=postgresql://cloudops:cloudops_dev_pass@postgres:5432/cloudops_db
      - LOG_LEVEL=INFO
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  event-processor:
    build:
      context: .
      dockerfile: Dockerfile
      target: event-processor
    container_name: cloudops-event-processor
    environment:
      - ENVIRONMENT=dev
      - LOG_LEVEL=INFO
      # The worker consumes telemetry persisted by the API, so it needs
      # the same database as the API.
      - DATABASE_URL=postgresql://cloudops:cloudops_dev_pass@postgres:5432/cloudops_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ml:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml
    container_name: cloudops-ml
    environment:
      - ENVIRONMENT=dev
      - LOG_LEVEL=INFO
    # One-shot batch job: trains and evaluates the Isolation Forest baseline,
    # prints metrics, then exits cleanly.
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: cloudops-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cloudops
      - POSTGRES_PASSWORD=cloudops_dev_pass
      - POSTGRES_DB=cloudops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cloudops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Reuse the canonical alert rules defined for Kubernetes deployments.
      - ./infrastructure/kubernetes/monitoring/alerts:/etc/prometheus/alerts:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cloudops-grafana
    ports:
      - "3000:3000"
    environment:
      # Local-only default credentials for development/demo. Override via
      # GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD for anything shared.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Mount the canonical dashboards instead of copying them, so Compose and
      # Helm always serve the same JSON (no drift).
      - ./infrastructure/kubernetes/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
