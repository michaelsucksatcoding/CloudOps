apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-ml
  namespace: cloudops-dev
  labels:
    app.kubernetes.io/name: cloudops-ml
    app.kubernetes.io/part-of: cloudops-ai
    app.kubernetes.io/component: ml
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudops-ml
  template:
    metadata:
      labels:
        app: cloudops-ml
        app.kubernetes.io/name: cloudops-ml
        app.kubernetes.io/part-of: cloudops-ai
        app.kubernetes.io/component: ml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ml
          image: cloudops-ml:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cloudops-config
            - secretRef:
                name: cloudops-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
