# Default values for the cloudops-ai Helm chart (cloud-neutral).
#
# Target: any generic local Kubernetes cluster (kind, k3d, minikube).
# The chart intentionally contains no cloud-provider assumptions: no cloud identity
# binding, no cloud ingress controller, no cloud block storage class, and no
# managed-service wiring. All services are ClusterIP; reach the API and the
# monitoring UIs with `kubectl port-forward` (see README.md).

global:
  environment: dev

namespace:
  # Namespaces are pre-provisioned (see infrastructure/kubernetes/namespaces/).
  # The application chart must NOT create them: namespaces are cluster-scoped.
  create: false
  name: cloudops-dev

config:
  logLevel: INFO

secrets:
  # DATABASE_URL is intentionally NOT committed here. The API receives it from
  # the generated cloudops-postgres-credentials Secret (see the postgres section).
  redisUrl: "redis://redis.cloudops-dev.svc.cluster.local:6379/0"

api:
  enabled: true
  replicaCount: 2
  serviceAccount:
    name: cloudops-api
    # Set to bind an externally-managed ServiceAccount instead of creating one.
    create: true
  image:
    repository: cloudops-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

ml:
  enabled: true
  replicaCount: 1
  image:
    repository: cloudops-ml
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# In-cluster PostgreSQL. The password is generated on first install
# (see templates/postgres-secret.yaml) and stored only in the referenced
# Kubernetes Secret; nothing sensitive is committed here. The Service name
# matches the DNS name the application expects
# (postgres.cloudops-dev.svc.cluster.local). The API image carries Alembic, so
# after deploying run migrations separately (Alembic is not run at startup):
#   kubectl exec -n cloudops-dev deploy/cloudops-ai-api -- alembic upgrade head
postgres:
  enabled: true
  serviceName: postgres
  user: cloudops
  database: cloudops_db
  port: 5432
  credentialsSecretName: cloudops-postgres-credentials
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  storage:
    size: 5Gi
    # Empty uses the cluster's own default StorageClass. Set this per cluster
    # if your default is unsuitable, e.g. "standard" (k3d) or "hostpath" (kind).
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

eventProcessor:
  enabled: true
  replicaCount: 1
  serviceAccount:
    name: cloudops-event-processor
    # Set to bind an externally-managed ServiceAccount instead of creating one.
    create: true
  image:
    repository: cloudops-event-processor
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
    targetPort: 9090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Optional generic Ingress. Disabled by default because a local cluster usually
# has no ingress controller; reach the API with `kubectl port-forward` instead.
# To enable, set enabled: true and className to your cluster's IngressClass
# (e.g. "nginx" for kind, "traefik" for k3d).
ingress:
  enabled: false
  className: ""
  annotations: {}
  path: /
  pathType: Prefix

networkPolicy:
  enabled: true

# Lightweight in-cluster monitoring for development and demonstrations. Both
# services are ClusterIP-only; access them with kubectl port-forward.
monitoring:
  enabled: true
  namespace:
    # The monitoring namespace is pre-provisioned (same
    # namespace-dev.yaml). The chart must NOT create it — namespace objects are
    # cluster-scoped.
    create: false
    name: cloudops-monitoring
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.54.1
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 9090
    scrapeInterval: 15s
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 11.2.0
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 3000
    # Generated on first install and stored only in the referenced Kubernetes
    # Secret (see templates/monitoring-grafana-secret.yaml); nothing sensitive
    # is committed. Leave the name/key as-is to use the generated Secret.
    adminPasswordSecret: cloudops-grafana-admin
    adminPasswordKey: password
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
