# Default values for cloudops-ai Helm chart.
# Declare variables to be passed into templates.

global:
  environment: dev
  awsRegion: us-east-1

namespace:
  # Namespaces are pre-provisioned infrastructure (see
  # infrastructure/kubernetes/namespaces/namespace-dev.yaml). The application
  # chart must NOT create them: namespaces are cluster-scoped and the GitHub
  # deploy role is intentionally namespace-scoped only.
  create: false
  name: cloudops-dev

config:
  logLevel: INFO
  # "in_memory" is used for local testing and the current dev deployment.
  telemetryProducer: in_memory
  s3DataLakeBucket: cloudops-telemetry-lake
  dynamodbHotTable: cloudops-telemetry-hot

secrets:
  # DATABASE_URL is intentionally NOT committed here. The API receives it from
  # the generated cloudops-postgres-credentials Secret (see the postgres section).
  redisUrl: "redis://redis.cloudops-dev.svc.cluster.local:6379/0"

api:
  enabled: true
  replicaCount: 2
  serviceAccount:
    name: cloudops-api
    # ARN of the IRSA role; leave empty to create the ServiceAccount without an annotation.
    iamRoleArn: ""
  image:
    repository: cloudops-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

ml:
  enabled: true
  replicaCount: 1
  image:
    repository: cloudops-ml
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Development in-cluster PostgreSQL. The password is generated on first install
# (see templates/postgres-secret.yaml) and stored only in the referenced
# Kubernetes Secret; nothing sensitive is committed here. The Service name
# matches the DNS name the application expects
# (postgres.cloudops-dev.svc.cluster.local). The API image carries Alembic, so
# after deploying run migrations separately (Alembic is not run at startup):
#   kubectl exec -n cloudops-dev deploy/cloudops-ai-api -- alembic upgrade head
postgres:
  enabled: true
  serviceName: postgres
  user: cloudops
  database: cloudops_db
  port: 5432
  credentialsSecretName: cloudops-postgres-credentials
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  storage:
    # Leave storageClass empty to use the cluster's default storage class.
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

eventProcessor:
  enabled: true
  replicaCount: 1
  serviceAccount:
    name: cloudops-event-processor
    # ARN of the IRSA role; leave empty to create the ServiceAccount without an annotation.
    iamRoleArn: ""
  image:
    repository: cloudops-event-processor
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
    targetPort: 9090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# AWS Load Balancer Controller is infrastructure, not application code.
# It is installed separately (see infrastructure/terraform/modules/alb-controller
# for the IAM role and the Kubernetes bootstrap manifests). The application
# chart only consumes the 'alb' IngressClass via the ingress below and does not
# install the controller, its ClusterRole(Binding), or its CRDs.

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health/live
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
  path: /
  pathType: Prefix

networkPolicy:
  enabled: true

# Lightweight in-cluster monitoring for development and demonstrations.  Both
# services are ClusterIP-only; access them with kubectl port-forward.
monitoring:
  enabled: true
  namespace:
    # The monitoring namespace is pre-provisioned infrastructure (same
    # namespace-dev.yaml). The chart must NOT create it — namespace objects are
    # cluster-scoped and the GitHub deploy role is namespace-scoped only.
    create: false
    name: cloudops-monitoring
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: v2.54.1
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 9090
    scrapeInterval: 15s
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 11.2.0
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 3000
    # This pre-existing Kubernetes Secret must contain the named key. Create
    # it outside version control (or through your secret-management workflow).
    adminPasswordSecret: cloudops-grafana-admin
    adminPasswordKey: password
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
