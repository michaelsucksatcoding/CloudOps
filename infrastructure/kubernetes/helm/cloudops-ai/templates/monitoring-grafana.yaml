{{- if and .Values.monitoring .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudops-ai.fullname" . }}-grafana-datasources
  namespace: {{ .Values.monitoring.namespace | default "cloudops-monitoring" }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "cloudops-ai.fullname" . }}-prometheus.{{ .Values.monitoring.namespace | default "cloudops-monitoring" }}.svc.cluster.local:{{ .Values.monitoring.prometheus.service.port | default 9090 }}
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudops-ai.fullname" . }}-grafana-dashboards-providers
  namespace: {{ .Values.monitoring.namespace | default "cloudops-monitoring" }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "CloudOps Dashboards"
        orgId: 1
        folder: "CloudOps AI"
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudops-ai.fullname" . }}-grafana-dashboards
  namespace: {{ .Values.monitoring.namespace | default "cloudops-monitoring" }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  system-overview.json: |
    {{- $.Files.Get "monitoring/dashboards/system-overview.json" | default "{}" | nindent 4 }}
  kubernetes-workloads.json: |
    {{- $.Files.Get "monitoring/dashboards/kubernetes-workloads.json" | default "{}" | nindent 4 }}
  ml-incidents.json: |
    {{- $.Files.Get "monitoring/dashboards/ml-incidents.json" | default "{}" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudops-ai.fullname" . }}-grafana
  namespace: {{ .Values.monitoring.namespace | default "cloudops-monitoring" }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cloudops-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "cloudops-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: "{{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.grafana.image.pullPolicy }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "monitoring.grafana.adminPasswordSecret is required" .Values.monitoring.grafana.adminPasswordSecret }}
                  key: {{ .Values.monitoring.grafana.adminPasswordKey | default "password" }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: {{ .Values.monitoring.grafana.service.port | default 3000 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.monitoring.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: {{ include "cloudops-ai.fullname" . }}-grafana-datasources
        - name: dashboard-providers
          configMap:
            name: {{ include "cloudops-ai.fullname" . }}-grafana-dashboards-providers
        - name: dashboards
          configMap:
            name: {{ include "cloudops-ai.fullname" . }}-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops-ai.fullname" . }}-grafana
  namespace: {{ .Values.monitoring.namespace | default "cloudops-monitoring" }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: {{ .Values.monitoring.grafana.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.monitoring.grafana.service.port | default 3000 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "cloudops-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
{{- end }}
