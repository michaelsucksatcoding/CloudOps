apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudops-ai.fullname" . }}-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  # DATABASE_URL is provided to the API via the cloudops-postgres-credentials
  # Secret (externalized, generated password) rather than committed here.
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
