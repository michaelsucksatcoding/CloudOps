{{- if .Values.postgres.enabled }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace .Values.postgres.credentialsSecretName) }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentialsSecretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s.%s.svc.cluster.local:%s/%s" .Values.postgres.user $password .Values.postgres.serviceName .Values.namespace.name (.Values.postgres.port | toString) .Values.postgres.database | quote }}
{{- end }}