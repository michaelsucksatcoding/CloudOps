{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudops-ai.fullname" . }}-postgres
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cloudops-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "cloudops-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        # fsGroup makes mounted volumes group-writable; the container runs the
        # official entrypoint as root (it chowns /var/lib/postgresql/data and
        # drops to the postgres user before starting the server).
        fsGroup: 999
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cloudops-ai.fullname" . }}-postgres-data
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.credentialsSecretName }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              # subPath avoids initialising postgres on the filesystem root of
              # a freshly provisioned EBS volume (which contains /lost+found).
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "{{ .Values.postgres.port }}"
                - -U
                - {{ .Values.postgres.user }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "{{ .Values.postgres.port }}"
                - -U
                - {{ .Values.postgres.user }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
{{- end }}