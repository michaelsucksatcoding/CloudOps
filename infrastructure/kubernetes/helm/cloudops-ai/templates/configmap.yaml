apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudops-ai.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
