{{- if and .Values.monitoring .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
{{- $grafanaNamespace := .Values.monitoring.namespace.name | default "cloudops-monitoring" }}
{{- $secretName := .Values.monitoring.grafana.adminPasswordSecret }}
{{- $secretKey := .Values.monitoring.grafana.adminPasswordKey | default "password" }}
{{- $existing := (lookup "v1" "Secret" $grafanaNamespace $secretName) }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data $secretKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $grafanaNamespace }}
  labels:
    {{- include "cloudops-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
stringData:
  {{ $secretKey }}: {{ $password | quote }}
{{- end }}