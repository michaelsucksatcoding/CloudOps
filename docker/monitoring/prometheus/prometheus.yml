# Prometheus scrape configuration for the local CloudOps AI stack.
# Scrapes the FastAPI /metrics endpoint exposed by the api service.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/prometheus-rules.yaml

scrape_configs:
  - job_name: cloudops-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: cloudops-api
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
